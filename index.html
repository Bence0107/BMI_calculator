<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI-kalkulátor</title>
</head>
<body>

  <p class="text-green-700 text-center font-bold">BMI-kalkulátor</p>
  <h1 class="text-4xl text-center font-bold">Te hová tartozol?</h1>

  <div class="urlap flex flex-col gap-2.5">
    <p class="font-bold">Számítsd ki a BMI-értékedet!</p>
    <div class="flex flex-row flex-wrap gap-2.5">
      <div class="flex flex-col gap-1">
        <label>Testsúly (kg)</label>
        <input id="testsuly" type="number" placeholder="Például: 68">
      </div>
      <div class="flex flex-col gap-1">
        <label>Magasság (cm)</label>
        <input id="magassag" type="number" placeholder="Például: 172">
      </div>
    </div>
    <button onclick="szamitas()">Számítás</button>
    <div id="eredmeny" class="eredmeny tunes"></div>
  </div>

  <p class="text-2xl font-bold text-center" style="margin-top: 2rem">BMI-kategóriák</p>
  <div class="cards"></div>

  <script type="module" src="/src/main.js"></script>

</body>
</html>
